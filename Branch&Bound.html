<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilihan Tim Proyek - Branch & Bound</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>📊 Pemilihan Tim Proyek</h1>
        <p>Menyelesaikan persoalan pemilihan <strong>k</strong> kandidat dari pool berisi <strong>n</strong> orang agar total biaya <strong>&le; B</strong> (Optimalisasi Branch & Bound)</p>
    </header>

    <div class="card">
        <h2>🛠️ Kontrol Parameter & Input</h2>
        
        <div class="control-grid">
            <div class="control-group">
                <label for="nInput">Ukuran Pool Calon (n &ge; 12):</label>
                <input type="number" id="nInput" value="12" min="12" step="1">
            </div>
            <div class="control-group">
                <label for="kInput">Ukuran Tim Pilihan (5 &le; k &le; 10):</label>
                <input type="number" id="kInput" value="5" min="5" max="10" step="1">
            </div>
            <div class="control-group">
                <label for="budgetInput">Batas Anggaran Proyek (B):</label>
                <input type="number" id="budgetInput" value="150" min="1" step="5">
            </div>
        </div>

        <div class="quick-presets">
            <span>Contoh Ukuran Pool:</span>
            <button type="button" class="secondary preset-btn" data-size="small">Small (n=12)</button>
            <button type="button" class="secondary preset-btn" data-size="medium">Medium (n=18)</button>
            <button type="button" class="secondary preset-btn" data-size="large">Large (n=24)</button>
        </div>

        <div class="btn-group">
            <button type="button" id="generateRandomBtn" class="secondary">🎲 Acak Biaya</button>
            <button type="button" id="solveBtn" class="success">✨ Hitung Tim Optimal</button>
        </div>

        <h3 style="margin-top:25px; margin-bottom:10px; color:#4a5568; font-size:1.05rem;">Masukkan Biaya c[i] untuk Setiap Kandidat:</h3>
        <div class="candidate-grid" id="candidateInputsContainer">
            <!-- Diisi secara dinamis lewat JS -->
        </div>
    </div>

    <div class="card" id="resultArea" style="display: none;">
        <h2>📌 Hasil Pemilihan Tim Optimal</h2>
        <div id="outputArea">
            <!-- Hasil pencarian Branch & Bound akan ditaruh di sini -->
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
